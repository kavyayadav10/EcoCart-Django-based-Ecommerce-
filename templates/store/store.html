{% extends 'homepage_site/home_nav.html' %}
{% block content %}
{% load static %}

<style>
    .parallelogram {
        width: 500px;
        height: 50px;
        transform: skew(20deg) scale(300%);
        margin-left: -3rem;
        margin-top: -1rem;
        z-index: -5;
    }

    .card_item {
        transition: transform 0.3s ease;
    }
    .card_item:hover {
        transform: scale(0.93);
    }

    .parallelograms {
        width: 400px;
        height: 70px;
        position: absolute;
        right: 0;
        transform: skew(20deg) scale(300%) rotateX(180deg) rotate(20deg);
        margin-top: 9rem;
        z-index: -5;
    }
</style>

<div class="absolute py-20" style="z-index: -1;background-color:lightgreen;">
    <div class="parallelograms i fixed px-16 "></div>
    <div class="mx-20 py-6 text-center text-8xl font-light" style="font-family: 'agency fb'; width: 90vw;">
        <img src="{% static 'media/carticon.png' %}" alt="" class="inline h-28 p-0 m-0"> <span>Store</span>
    </div>

    <div class="py-4 my-2 flex justify-between items-center mx-20">
        <span class="text-xl">
            Search Results: <b>{{ product_count }}</b>
        </span>

        <!-- Sorting Dropdown -->
        <form method="GET" id="sortForm">
            {% if request.GET.q %}
                <input type="hidden" name="q" value="{{ request.GET.q }}">
            {% endif %}
            <select name="sort" id="sort" class="border px-2 py-1 rounded">
                <option value="">Sort by</option>
                <option value="low_to_high" {% if request.GET.sort == "low_to_high" %}selected{% endif %}>
                    Price: Low to High
                </option>
                <option value="high_to_low" {% if request.GET.sort == "high_to_low" %}selected{% endif %}>
                    Price: High to Low
                </option>
            </select>
        </form>
    </div>

    <center>
        <hr class="h-1" style="width:300px">
    </center>
    <br>

    <section class="product mx-20 relativea">
        <center>
        {% for product in products %}
            <a href="{{ product.get_url }}">
                <div class="product_overview justify-center inline-block shadow-md border hover:shadow-black rounded-md scale-90 card_item"
                     style="background-color:white; width: 351px;max-width: 351px; height: 385px;max-height: 385px;">
                    
                    <h1 class="text-center mt-3 font-bold text-xl mb-0" style="font-family:lato;">
                        {{ product.product_name }}
                    </h1>

                    <div class="product_img">
                        <img src="{{ product.image.url }}" alt="{{ product.product_name }}"
                             class="object-cover border scale-90 rectangle"
                             style="margin-top: -.5rem; width: 351px; max-width: 351px; height: 315px; max-height: 315px;">
                    </div>

                    <h2 class="text-center" style="font-family: lato;">
                        ₹. {{ product.price }}
                    </h2>

                </div>
            </a>
        {% endfor %}
        </center>
    </section>
</div>

<script>
    document.getElementById('sort').addEventListener('change', function() {
        document.getElementById('sortForm').submit();
    });
</script>

{% endblock %}
